name: QUGaR
channels:
  - conda-forge
dependencies:
  # Explicit pins for compatibility
  - python >=3.11        # dolfinx 0.11 / ffcx 0.11 dropped Python 3.10
  - fenics-dolfinx ==0.11.0

  - mpich
  - pyvista
  - scipy
  - liblapacke
  - openblas

  - scikit-build-core
  - cmake
  - ninja
  - catch2
  - doxygen
  - nanobind

  - sphinx
  - breathe
  - myst-parser
  - markdown

  - ipython
  - pytest
  - jupytext
  - pip
  - pip:
      - sphinx-rtd-dark-mode

